version: "2"
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - misspell
    - noctx
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - usestdlibvars
  settings:
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
  exclusions:
    generated: strict
    presets:
      - comments
      - std-error-handling
formatters:
  enable:
    - gofmt
