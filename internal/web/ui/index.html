<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Upkeep</title>
<link rel="stylesheet" href="app.css">
<script src="app.js" defer></script>
</head>
<body data-session="local">
<header class="bar">
  <div class="brand">
    <span class="mark" aria-hidden="true"></span>
    <span class="name">Upkeep</span>
  </div>
  <p class="tagline">Keeps your pull requests mergeable.</p>
  <span id="status" class="status" role="status" aria-live="polite">connecting</span>
</header>
<main>
  <section class="toolbar" aria-label="Queue">
    <button id="work" type="button" disabled>Work the queue</button>
    <p class="hint">The queue runner arrives in a later build. This page already listens to the live event stream.</p>
  </section>
  <section id="board" class="board" aria-label="Pull requests">
    <div class="column" data-column="blocked">
      <h2>Blocked</h2>
      <p class="empty">No pull requests yet.</p>
    </div>
    <div class="column" data-column="working">
      <h2>Working</h2>
      <p class="empty">Nothing in progress.</p>
    </div>
    <div class="column" data-column="verified">
      <h2>Verified</h2>
      <p class="empty">Nothing verified yet.</p>
    </div>
    <div class="column" data-column="done">
      <h2>Done</h2>
      <p class="empty">Nothing done yet.</p>
    </div>
  </section>
  <section class="feed" aria-label="Event stream">
    <h2>Events</h2>
    <ol id="events" class="events"></ol>
  </section>
</main>
</body>
</html>
