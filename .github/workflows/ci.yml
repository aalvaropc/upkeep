name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-targets-main:
    name: pr-targets-main
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require main as the base branch
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$BASE_REF" != "main" ]; then
            echo "::error::Pull requests must target main, not $BASE_REF."
            exit 1
          fi

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan the full history for secrets
        run: |
          docker run --rm -v "$PWD:/repo" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 git --redact --no-banner -v /repo

  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.26.x"
          cache-dependency-path: go.mod
      - name: gofmt
        run: make fmt-check
      - name: go mod tidy
        run: make tidy-check
      - name: Direct dependencies
        run: make deps-check
      - name: No comments
        run: make nocomments
      - name: go vet
        run: make vet
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.12.2
      - name: go test
        run: make test

  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.26.x"
          cache-dependency-path: go.mod
      - name: Build
        run: make build
      - name: Smoke
        run: make smoke
